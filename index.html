<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fichas de Calidad Contraste</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f2338"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f2338;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff}
.b{width:min(92vw,380px);text-align:center}.logo{width:64px;height:64px;border-radius:16px;background:#f26a21;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700}
h1{font-size:24px;margin:0 0 6px}p{margin:0 0 22px;color:#b9c6d6;font-size:15px}
input{width:100%;padding:14px 16px;font-size:18px;border-radius:12px;border:2px solid #29425e;background:#16304b;color:#fff;outline:none}input:focus{border-color:#f26a21}
button{margin-top:14px;width:100%;padding:14px;font-size:18px;font-weight:600;border:0;border-radius:12px;background:#f26a21;color:#fff}
.e{color:#ff9d7a;min-height:22px;margin-top:12px;font-size:15px}label{display:block;margin-top:14px;color:#b9c6d6;font-size:15px}
</style></head><body>
<div class="b"><div class="logo">✓</div><h1>Fichas de Calidad</h1>
<form id="f"><input id="p" type="password" placeholder="Contraseña" autocomplete="current-password" autofocus>
<label><input id="r" type="checkbox" checked style="width:auto;margin-right:8px;vertical-align:middle"> Recordarme en este equipo</label>
<button id="go" type="submit">Entrar</button><div class="e" id="e"></div></form></div>
<script>
const N=3,K='fichas-pw';
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
let blob=null;
async function load(){if(blob)return blob;const parts=await Promise.all(Array.from({length:N},(_,i)=>fetch('d'+i+'.bin').then(r=>{if(!r.ok)throw 0;return r.arrayBuffer();})));
 const t=parts.reduce((a,b)=>a+b.byteLength,0),u=new Uint8Array(t);let o=0;parts.forEach(b=>{u.set(new Uint8Array(b),o);o+=b.byteLength;});return blob=u;}
async function open_(pw){const u=await load(),salt=u.slice(0,16),iv=u.slice(16,28),ct=u.slice(28);
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:300000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
 const html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
 document.open();document.write(html);document.close();}
async function go(pw,remember){const e=document.getElementById('e'),b=document.getElementById('go');e.textContent='';b.disabled=true;b.textContent='Abriendo…';
 try{await open_(pw);if(remember)try{localStorage.setItem(K,pw)}catch(_){}}
 catch(err){b.disabled=false;b.textContent='Entrar';e.textContent=err===0?'Sin conexión. Conéctate una vez para descargar la app.':'Contraseña incorrecta.';try{localStorage.removeItem(K)}catch(_){}}}
document.getElementById('f').addEventListener('submit',ev=>{ev.preventDefault();go(document.getElementById('p').value,document.getElementById('r').checked);});
try{const s=localStorage.getItem(K);if(s)go(s,true);}catch(_){}
</script></body></html>
